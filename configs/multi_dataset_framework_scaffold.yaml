experiment_name: framework_scaffold_example

dataset:
  name: kaist_rotating_machine
  variant: compact_vibration_thermal_features
  group_column: session_id
  label_column: label
  multiclass_label_column: multiclass_label

paths:
  results_root: results
  feature_dataset_path: results/kaist_feature_build/datasets/kaist_vibration_thermal_features.csv

model:
  classifier:
    n_estimators: 300
    random_state: 42
    max_depth: null
    min_samples_leaf: 1
    n_jobs: -1
    class_weight: balanced
    balance_strategy: downsample_majority
    balance_target_ratio: 1.0
  anomaly:
    n_estimators: 200
    random_state: 42
    contamination: auto
    one_class_svm_nu: 0.1
    one_class_svm_kernel: rbf
    one_class_svm_gamma: scale
    threshold_strategy: quantile
    threshold_quantile: 0.99
    threshold_buffer_std: 1.0
    minimum_healthy_windows: 50
    threshold_sweep_points: 101

evaluation:
  healthy_label: healthy
  test_fraction: 0.25
  random_state: 42
  split_strategy: session
  positive_labels:
    - faulty
